<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Top nav (always visible) ===== -->
  <header class="nav">
    <nav class="nav-left">
      <a href="#" data-soon>Shop</a>
      <a href="#play" class="active" data-go="play">Play</a>
    </nav>
    <!-- LOGO: edit these two files in assets/logo/ (dark one shows on light pages, light one on the dark Play page) -->
    <a href="#play" class="logo" data-go="play" aria-label="Home">
      <img class="logo-dark" src="assets/logo/logo-dark.png" alt="Logo">
      <img class="logo-light" src="assets/logo/logo-light.png" alt="">
    </a>
    <nav class="nav-right">
      <a href="#" data-soon>Cart (<span id="cartCount">0</span>)</a>
      <a href="#" data-soon>Information</a>
    </nav>
  </header>

  <!-- ===== VIEW: Play (world of characters) ===== -->
  <section class="view active" id="view-play">
    <div id="world"><div id="worldInner"><img id="worldBg" src="assets/art/world-bg.jpg" alt="" draggable="false"></div></div>

    <p class="intro" id="intro">Explore the story of Loy krathong</p>

    <!-- speech bubble shown next to a clicked character -->
    <div class="bubble" id="bubble" aria-live="polite">
      <p class="bubble-text" id="bubbleText"></p>
      <button class="pill pill-yellow" data-activity="color">Color</button>
      <button class="pill pill-green" data-activity="dots">Connect the dots</button>
    </div>

    <button class="sound" id="sound" aria-label="Toggle sound">
      <img id="soundImg" src="assets/icons/sound-on.png" alt="">
    </button>
  </section>

  <!-- ===== VIEW: Connect the dots ===== -->
  <section class="view" id="view-dots">
    <div class="dots-stage" id="dotsStage">
      <svg id="dotsLines"></svg>
    </div>
    <h2 class="bottom-title">Connect the dots.</h2>
    <a href="#play" class="back-link" data-go="play">Back to Play</a>
  </section>

  <!-- ===== VIEW: Reveal after dots ===== -->
  <section class="view" id="view-reveal">
    <img class="reveal-img" id="revealImg" src="assets/art/ector-outline.png" alt="">
    <div class="reveal-copy">
      <h2 id="revealTitle">Hello there! This is Ector.</h2>
      <p id="revealBody">Nobody knows for certain how old Ector really is. His wise stories often leave us clues.</p>
      <a href="#color" class="link-btn" data-go="color">Let’s color!</a>
      <a href="#play" class="back-link-inline" data-go="play">Back to Play</a>
    </div>
  </section>

  <!-- ===== VIEW: Coloring ===== -->
  <section class="view" id="view-color">
    <a href="#play" class="back-top" data-go="play">← Back to Play</a>

    <div class="paint-stage" id="paintStage">
      <canvas id="paint"></canvas>
      <img id="art" src="assets/art/coloring-page.png" alt="Coloring page" draggable="false">
    </div>

    <div class="tools">
      <div class="btn-grid">
        <button class="pill-outline" id="btnStartOver">Start over</button>
        <button class="pill-outline" id="btnEraser" aria-pressed="false">Eraser</button>
        <button class="pill-outline" id="btnSave">Save</button>
        <button class="pill-outline" id="btnShare">Share</button>
      </div>

      <div class="palette-wrap">
        <span class="pick-hint" id="pickHint">PICK A<br>COLOR <i>↴</i></span>
        <div class="palette" id="palette" role="radiogroup" aria-label="Colors"></div>
      </div>

      <input type="range" id="size" min="6" max="80" value="30" aria-label="Brush size">
    </div>

    <div class="brush-cursor" id="brushCursor"></div>
  </section>

  <canvas id="confetti"></canvas>
  <div id="ripples" aria-hidden="true"></div>
  <div class="fade-bottom"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
